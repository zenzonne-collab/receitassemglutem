<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sem Glúten & Gostoso</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#5C3317"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --marrom-escuro: #1A0D05;
      --marrom-medio: #3D1F0A;
      --marrom-pao: #5C3317;
      --dourado: #C8860A;
      --creme: #F5E6C8;
      --creme-suave: #FBF3E0;
      --laranja-quente: #D4691E;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--marrom-escuro);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Textura de fundo */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #5C3317 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, #3D1F0A 0%, transparent 50%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 3px,
          rgba(200,134,10,0.03) 3px,
          rgba(200,134,10,0.03) 6px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Partículas flutuantes */
    .particles {
      position: fixed; inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--dourado);
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.4; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
    }

    /* Card central */
    .card {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 3rem 2.5rem;
      background: rgba(44, 26, 14, 0.75);
      border: 1px solid rgba(200, 134, 10, 0.3);
      border-radius: 2rem;
      backdrop-filter: blur(12px);
      box-shadow:
        0 32px 80px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(200,134,10,0.2);
      max-width: 380px;
      width: 90%;
      animation: cardIn 0.8s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Ícone do pão */
    .icon-wrap {
      width: 110px; height: 110px;
      background: radial-gradient(circle at 35% 35%, #E8A055, #7A3A10);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      box-shadow: 0 8px 32px rgba(200,134,10,0.4), 0 2px 8px rgba(0,0,0,0.5);
      animation: pulse 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }
    .icon-wrap::after {
      content: '';
      position: absolute;
      top: 15%; left: 20%;
      width: 30%; height: 20%;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(200,134,10,0.4), 0 2px 8px rgba(0,0,0,0.5); }
      50%       { box-shadow: 0 8px 48px rgba(200,134,10,0.7), 0 2px 8px rgba(0,0,0,0.5); }
    }

    /* Textos */
    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2rem);
      color: var(--creme);
      text-align: center;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .title em {
      font-style: italic;
      color: var(--dourado);
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(245, 230, 200, 0.6);
      text-align: center;
      line-height: 1.6;
      font-weight: 300;
      max-width: 260px;
    }

    /* Badge */
    .badge {
      display: flex; align-items: center; gap: 0.5rem;
      background: rgba(200, 134, 10, 0.15);
      border: 1px solid rgba(200, 134, 10, 0.4);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.75rem;
      color: var(--dourado);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Botão principal */
    .btn-instalar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #C8860A 0%, #D4691E 100%);
      color: #1A0D05;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 20px rgba(200,134,10,0.4);
      position: relative;
      overflow: hidden;
    }
    .btn-instalar::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-instalar:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(200,134,10,0.55);
      filter: brightness(1.08);
    }
    .btn-instalar:hover::before { opacity: 1; }
    .btn-instalar:active { transform: translateY(0); }

    .btn-icon { font-size: 1.3rem; }

    /* Botão secundário (abrir direto) */
    .btn-abrir {
      display: block;
      text-align: center;
      color: rgba(245,230,200,0.45);
      font-size: 0.82rem;
      font-weight: 300;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: color 0.2s;
      cursor: pointer;
      background: none;
      border: none;
    }
    .btn-abrir:hover { color: var(--creme); }

    /* Toast de confirmação */
    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(44,26,14,0.95);
      border: 1px solid var(--dourado);
      color: var(--creme);
      padding: 0.8rem 1.5rem;
      border-radius: 1rem;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
      z-index: 100;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Estrelas decorativas */
    .stars {
      display: flex; gap: 0.3rem;
    }
    .star { color: var(--dourado); font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- Partículas -->
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="icon-wrap">🍞</div>

    <div class="stars">
      <span class="star">✦</span>
      <span class="star" style="opacity:.5">✦</span>
      <span class="star">✦</span>
    </div>

    <h1 class="title">Sem Glúten<br/><em>&amp; Gostoso</em></h1>

    <p class="subtitle">
      Receitas aconchegantes, saborosas e 100% livres de glúten para o seu dia a dia.
    </p>

    <span class="badge">🌾 100% sem glúten</span>

    <button class="btn-instalar" id="btnInstalar">
      <span class="btn-icon">📲</span>
      Instalar Aplicativo
    </button>

    <button class="btn-abrir" id="btnAbrir">Já tenho instalado — abrir direto</button>
  </div>

  <div class="toast" id="toast">✅ Aplicativo instalado com sucesso!</div>

  <script>
    // Partículas flutuantes
    const container = document.getElementById('particles');
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 5 + 2;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${Math.random()*12+8}s;
        animation-delay:${Math.random()*10}s;
        opacity:0;
      `;
      container.appendChild(p);
    }

    // Registra SW
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
    });

    const btnInstalar = document.getElementById('btnInstalar');
    const btnAbrir    = document.getElementById('btnAbrir');
    const toast       = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    btnInstalar.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === 'accepted') {
          showToast('✅ Instalando…');
          setTimeout(() => window.location.href = 'app.html', 1500);
        }
      } else {
        // Fallback: abre diretamente
        window.location.href = 'app.html';
      }
    });

    btnAbrir.addEventListener('click', () => {
      window.location.href = 'app.html';
    });

    // Se já instalado como PWA, redireciona automaticamente
    if (window.matchMedia('(display-mode: fullscreen)').matches ||
        window.matchMedia('(display-mode: standalone)').matches) {
      window.location.href = 'app.html';
    }
  </script>
</body>
</html>
